<!DOCTYPE html>
<html>
    <head>
        <title>Data Gathering</title>
    </head>
    <body onload="on_page_load()">
        <div><h1>Data Gathering</h1></div>
        <div><img src="cam" alt="Camera Image" style="width: 640px; height: auto;"></div>

        <div><h2>Controls</h2></div>
        <div><button onclick="toggle_recording()" id="recording_start">Start Recording</button></div>
        <p>Status: <span id="status">0</span></p>
        <p>Image directory: <span id="image_dir">0</span></p>
        <p>Capture delay: <span id="capture_delay">0</span> seconds</p>
        <p>Images taken: <span id="images_taken">0</span></p>
        <p>Storage left: <span id="storage_left">0</span></p>

        <div><h2>Settings</h2></div>
        <p>Capture delay: <input type="number" id="capture_delay_setting" /> seconds</p>
        <p>Image directory: <input type="text" id="image_dir_setting" /></p>
        <div><button onclick="update_settings()">Update Settings</button></div>
    </body>
</html>

<!-- Socket.IO -->
<script src="/static/js/socket.io.min.js"></script>

<script>
    function update_stats(data, on_start = false) {
        if (data.recording) {
            document.getElementById("status").textContent = "Recording";
            document.getElementById("recording_start").textContent = "Stop recording";
        } else {
            document.getElementById("status").textContent = "Idle";
            document.getElementById("recording_start").textContent = "Start recording";
        }

        if (on_start) {
            document.getElementById("capture_delay_setting").value = data.capture_delay;
            document.getElementById("image_dir_setting").value = data.image_dir;
        }
        
        document.getElementById("image_dir").textContent = data.image_dir;
        document.getElementById("images_taken").textContent = data.images_taken;
        document.getElementById("storage_left").textContent = data.storage_left;
        document.getElementById("capture_delay").textContent = data.capture_delay;
    }

    async function on_page_load() {
        const response = await fetch("/stats", {
            method: "GET"
        })

        update_stats(await response.json(), true);
    }

    async function toggle_recording() {
        const response = await fetch("/toggle_recording", {
            method: "GET" // default, so we can ignore
        })

        update_stats(await response.json());
    }

    async function update_settings() {
        const response = await fetch("/update_settings", {
            method: "POST",
            body: JSON.stringify({
                "output_dir": document.getElementById("image_dir_setting").value,
                "capture_delay": parseInt(document.getElementById("capture_delay_setting").value)
            }),
            headers: {
                "Content-type": "application/json; charset=UTF-8"
            }
        })

        const json_response = await response.json()

        alert(json_response.message)
    }

    const socket = io();

    socket.on("stats_update", (data) => {
        update_stats(data)
    });
</script>
