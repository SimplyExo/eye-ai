DISTRO = "eyeaivision"
DISTRO_NAME = "Linux distro for EyeAIVision Pro"
DISTRO_VERSION = "1.0"
MAINTAINER = "Thomas Fritzler <thomas_fritzler@web.de>"

# C library we want to use
TCLIBC = "glibc"

INIT_MANAGER = "mdev-busybox"

# Quality assurance checks
ERROR_QA:append = " textrel host-user-contaminated"
WARN_QA:append = " buildpaths ldflags"

hostname:pn-base-files = "eyeaivision"