BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-eyeai"
BBFILE_PATTERN_meta-eyeai = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-eyeai = "10"

LAYERDEPENDS_meta-eyeai = "core"
LAYERSERIES_COMPAT_meta-eyeai = "blacksail"
