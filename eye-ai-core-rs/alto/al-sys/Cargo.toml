[package]
name = "al-sys"
version = "0.6.1"
edition = "2015"
description = "Raw bindings for OpenAL 1.1"
documentation = "https://docs.rs/al-sys"
homepage = "https://www.jpernst.com"
repository = "https://github.com/jpernst/alto.git"
license = "MIT/Apache-2.0"
keywords = ["al", "audio", "openal", "sound"]
categories = ["external-ffi-bindings", "multimedia::audio"]

[package.metadata.rust-analyzer]
diagnostics.disabled = ["macro-error"]

[dependencies]

[build-dependencies]
cmake = "0.1.40"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
libloading = { version = "0.5", optional = true }
rental = { version = "0.5.0", optional = true }

[features]
default = ["dynamic"]
dynamic = ["libloading", "rental"]
