[package]
name = "eye-ai-core-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tflite-dyn = { path = "tflite-dyn" }
thiserror = "2.0"
va_list = "0.2.1"
libloading = "0.7.2"

[build-dependencies]
cc = "1.2.39"

[workspace]
members = [
  "build_android",
  "native_lib",
  "tflite-dyn"
]

[workspace.dependencies]
uniffi = { version = "0.29", features = ["cli"] }
uniffi_bindgen = "0.29"
