[package]
name = "eye-ai-core-rs"
version = "0.1.0"
edition = "2024"
documentation = "https://simplyexo.github.io/eye-ai-docs/"

[workspace]
members = [
  "build_android",
  "native_lib",
  "profiling_attribute"
]

[workspace.dependencies]
uniffi = { version = "0.29", features = ["cli"] }
uniffi_bindgen = "0.29"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-tracy = { version = "0.11.4", default-features = false }

[dependencies]
alto = { git = "https://github.com/Peanutt42/alto", tag = "3.1.0", version = "=3.1.0" }
bytetrack-cpp-rs = { git = "https://github.com/Peanutt42/bytetrack-cpp-rs", tag = "v0.1.1", version = "=0.1.1" }
crossbeam = "0.8.4"
eye-ai-core-rs-profiling_attribute = { path = "profiling_attribute" }
json = "0.12.4"
libloading = "0.7.2"
semver = "1.0.4"
symphonia = { version = "0.5.4", features = ["all"] }
tflite-dyn = { git = "https://github.com/Peanutt42/tflite-dyn", tag = "0.2.1", version = "=0.2.1" }
thiserror = "2.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-tracy = { workspace = true }
va_list = "0.2.1"
zerocopy = "0.8.27"
dur = "0.5.3"

[dev-dependencies]
image = "0.25"
ndarray = "0.16.1"
ndarray-npy = "0.9.1"

[build-dependencies]
cc = "1.2.39"

[features]
enable_tracy_profiling = [
  "eye-ai-core-rs-profiling_attribute/enable_tracy",
  "tracing-tracy/enable"
]
