[package]
name = "eye-ai-core-rs"
version = "0.1.0"
edition = "2024"
documentation = "https://simplyexo.github.io/eye-ai-docs/"

[workspace]
members = [
  "build_android",
  "native_lib",
  "profiling_attribute"
]

[workspace.dependencies]
uniffi = { version = "0.29", features = ["cli"] }
uniffi_bindgen = "0.29"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-tracy = { version = "0.11.4", default-features = false }

[dependencies]
alto = { git = "https://github.com/Peanutt42/alto", tag = "3.1.0", version = "=3.1.0" }
bytetrack-cpp-rs = { path = "third_party/bytetrack-cpp-rs", version = "=0.1.1" }
crossbeam = "0.8.4"
eye-ai-core-rs-profiling_attribute = { path = "profiling_attribute" }
json = "0.12.4"
litert = "0.2.1"
symphonia = { version = "0.5.5", features = ["all"] }
thiserror = "2.0.18"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-tracy = { workspace = true }
dur = "0.5.3"

[dev-dependencies]
image = "0.25"
ndarray = "0.17.2"
ndarray-npy = "0.10.0"

[build-dependencies]
dirs = "6.0"

[features]
enable_tracy_profiling = [
  "eye-ai-core-rs-profiling_attribute/enable_tracy",
  "tracing-tracy/enable"
]
